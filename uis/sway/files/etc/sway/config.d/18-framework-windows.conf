# The framework's windows (docs/plan-ui.md §3): every command names one of three
# shapes in the Rust command table, and the host starts foot with
# `--app-id=hayato-<shape> --window-size-pixels=<shape size>` (host.rs). The size
# is foot's because a `resize set` here applies at map time and foot then commits
# its own preferred size over it (measured: 900x600 rule, 700x496 window, and the
# centre still computed from 900). What is left for sway is placement, which only
# the compositor can decide.
#
# The app itself cannot do this with `swaymsg`: it runs before foot's first
# commit, so the criteria match no node. A shape with no rule - `hayato-full` -
# owns the whole screen.
for_window [app_id="hayato-pick"] floating enable
for_window [app_id="hayato-pick"] move position center

for_window [app_id="hayato-task"] floating enable
for_window [app_id="hayato-task"] move position center

for_window [app_id="hayato-wide"] floating enable
for_window [app_id="hayato-wide"] move position center

# Same rules for an X11 client that ever uses the same names (foot is Wayland
# here; the class criterion costs nothing and covers an Xwayland terminal).
for_window [class="hayato-pick"] floating enable
for_window [class="hayato-pick"] move position center
for_window [class="hayato-task"] floating enable
for_window [class="hayato-task"] move position center
for_window [class="hayato-wide"] floating enable
for_window [class="hayato-wide"] move position center

# Hayato Studio webcam picture-in-picture overlay: floating, sticky across
# workspaces, borderless, and inhibits idle while visible.
for_window [app_id="hayato-webcam"] floating enable, sticky enable, border none, inhibit_idle visible
