# Hayato Cassette: terminal-native local & Spotify cyberdeck music player
for_window [app_id="hayato-cassette"] floating enable, resize set 1120 680, move position center

# Toggle Hayato Cassette music player (scratchpad)
bindsym $mod+m exec hayato-cassette --toggle

# Hardware media keys (MPRIS via playerctl)
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
