# The Quake console (~/.config/bin/lazyos-quake, Alt+`): a terminal that drops
# from the top of the screen, full width and 60% tall, with no border. Sway puts
# it in the scratchpad as soon as it maps, so the same key hides it again and
# the agent's session survives in between; `lazyos quake show` brings it back at
# this size and position. 60% leaves the window below visible while the agent
# runs, which is the whole point of a drop-down console.
for_window [app_id="lazyos-quake"] floating enable
for_window [app_id="lazyos-quake"] border none
for_window [app_id="lazyos-quake"] resize set width 100 ppt height 60 ppt
for_window [app_id="lazyos-quake"] move absolute position 0 0
for_window [app_id="lazyos-quake"] move scratchpad
