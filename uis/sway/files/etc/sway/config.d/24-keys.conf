# Launcher views, system panels and session shortcuts
#
# This session's primary modifier ($mod) is Alt; full shortcut tables and details
# are documented in /usr/share/doc/hayato/03-shortcuts.md
#
# Every binding here has a one-line description above it: hayato-keys (Alt+Ctrl+K)
# shows those comments, and a description covers the bindings below it until a
# blank line or another comment, so a binding without one appears as its raw
# command

# Every binding, searchable; Enter copies the command
bindsym $mod+Ctrl+k exec /home/brunux/.config/bin/hayato-keys

# Dictation: hold to speak and release to transcribe (or tap/menu to toggle)
bindsym --no-repeat $mod+Ctrl+x exec /home/brunux/.config/bin/dictate --press
bindsym --release $mod+Ctrl+x exec /home/brunux/.config/bin/dictate --release

# Coding agents: launch, accounts, install
bindsym $mod+Ctrl+Shift+a exec /home/brunux/.config/bin/hayato-agents

# Developer: export your profile (keys, configs, package list) encrypted to a
# disk, restore one, or save a diagnostics bundle for a bug report
bindsym $mod+Ctrl+d exec /home/brunux/.config/bin/hayato-dev

# The internal panel back on, with no picture at all: the display menu cannot be
# drawn when every output is off (sway allows turning the last one off), so this
# runs the sway command directly. It is the way out of a black screen
bindsym $mod+Ctrl+Shift+d exec /home/brunux/.config/bin/hayato-display --panel-on

# The root menu, the bar's menu button on the keyboard
bindsym $mod+space exec /home/brunux/.config/bin/bar-menu

# Audio output panel: the sinks, plus the two mutes
bindsym $mod+Ctrl+a exec /home/brunux/.config/bin/bar-audio

# Bluetooth panel: scan, then connect or disconnect
bindsym $mod+Ctrl+b exec /home/brunux/.config/bin/bar-bt

# Network panel: Wi-Fi list, strongest first
bindsym $mod+Ctrl+w exec /home/brunux/.config/bin/bar-net

# Power menu: lock, suspend, hibernate, log out, reboot, shut down
bindsym $mod+Ctrl+p exec /home/brunux/.config/bin/hayato-power

# Files: browse a directory, and read a text file in foot
bindsym $mod+Ctrl+f exec /home/brunux/.config/bin/hayato-files

# The file manager in a window: drag and drop, a multi-selection, renaming in
# place, the trash - what a list cannot do, on the Shift variant of the Files
# key above. $HOME is passed explicitly because the window would otherwise open
# at the session's working directory
bindsym $mod+Ctrl+Shift+f exec favnyr "$HOME"

# Search inside the files: ripgrep over $HOME, and the match opens where it is
# (Alt+Search searches file *names*, this searches their contents; g is the
# one letter of the panel scheme that was still free)
bindsym $mod+Ctrl+g exec /home/brunux/.config/bin/hayato-grep

# Settings: one panel for the radio switches, night light and rotation
bindsym $mod+Ctrl+o exec /home/brunux/.config/bin/hayato-settings

# Calculator: evaluate expressions live, Enter copies the result
bindsym $mod+Ctrl+q exec /home/brunux/.config/bin/hayato-calc
bindsym $mod+c exec /home/brunux/.config/bin/hayato-calc

# Notification history and do-not-disturb
bindsym $mod+Ctrl+n exec /home/brunux/.config/bin/hayato-notify-history

# Act on the newest notification without taking focus: default action, Files,
# or dismiss. Shift dismisses it; Ctrl clears the visible stack.
bindsym $mod+comma exec hayato-notify --control act-newest
bindsym $mod+Shift+comma exec hayato-notify --control dismiss-newest
bindsym $mod+Ctrl+comma exec hayato-notify --control dismiss-all

# Clipboard history: Enter copies an entry back, Alt+1 deletes it
bindsym $mod+Ctrl+v exec /home/brunux/.config/bin/hayato-clip

# Hayato Lens: capture screen region to text, link, translate, note, or QR
bindsym $mod+i exec hayato menu lens

# Hayato Studio: screen recording, webcam video, photo snap, and live HUD
bindsym $mod+Ctrl+r exec hayato-studio

# Hayato Share: send/receive files, links, clipboard & Wi-Fi QR
bindsym $mod+Ctrl+u exec hayato share

# Emoji: type a name and the glyph is inserted at the cursor
bindsym $mod+Ctrl+e exec /home/brunux/.config/bin/hayato-emoji

# Translate the selected text (or the clipboard) into the language Settings sets, English until it is set
bindsym $mod+Ctrl+t exec /home/brunux/.config/bin/translate

# The local model: Qwen3.5-0.8B on this machine's four big cores, in its own window (no network, no account)
bindsym $mod+Ctrl+m exec /home/brunux/.config/bin/hayato-model

# Interactive theme selector: browse palettes and wallpapers with live preview
bindsym $mod+Ctrl+Shift+t exec /home/brunux/.config/bin/hayato-theme-picker

# Float the focused window
bindsym $mod+t floating toggle

# Close the focused window
bindsym $mod+q kill

# Switch the audio output without the bar
bindsym --locked Shift+XF86AudioMute exec /home/brunux/.config/bin/bar-audio

# The agent console: drop a terminal from the top, hide it again on the same key
bindsym $mod+grave exec /home/brunux/.config/bin/hayato-quake

# Scratchpad: show or cycle the hidden window
bindsym $mod+Ctrl+grave scratchpad show

# Scratchpad: send the focused window there
bindsym $mod+Shift+grave move scratchpad

# Alt+minus and Alt+Shift+minus keep working as the sway-default aliases for the
# two scratchpad actions above
