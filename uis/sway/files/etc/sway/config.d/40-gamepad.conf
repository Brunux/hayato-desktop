# A USB or Bluetooth gamepad as arrows, Enter and Escape in the framework's own
# windows (app id `hayato-*`: the root menu, Settings, Files, every TUI screen).
# The Games library reads the pad itself; RetroArch and the HTML games keep
# their own input, so a pad never moves two things at once. `hayato gamepad`
# reads /dev/input and injects the keys with wtype; its pid lock keeps it single.
exec hayato gamepad
