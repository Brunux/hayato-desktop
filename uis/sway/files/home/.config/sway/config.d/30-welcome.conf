# The first boot's Personal Setup Assistant window (see ~/.config/bin/hayato-welcome).
# It floats centred at 940x620 (Shape::Task) to fit the 8-step stepper cleanly on
# 1366x912 and 1920x1200 panels. The script shows it once per install and remembers
# the machine id in ~/.local/state/hayato/welcome (and progress in setup.json).
for_window [app_id="hayato-welcome"] floating enable
for_window [app_id="hayato-welcome"] resize set 940 620
for_window [app_id="hayato-welcome"] move position center

exec /home/brunux/.config/bin/hayato-welcome
