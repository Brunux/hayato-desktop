# The user's idle and lock timeouts.
#
# /etc/sway/config.d/23-lazyos-screensaver.conf starts the system chain with
# 150/300/360 s. This drop-in is read after /etc/sway/config, so `lazyos-idle`
# can replace that chain with the values in ~/.config/lazyos/idle.conf (the
# Settings -> Power & Idle row writes them). It kills only swayidle and starts
# one detached chain; a missing helper leaves the system chain in place.
exec $HOME/.config/bin/lazyos-idle start
