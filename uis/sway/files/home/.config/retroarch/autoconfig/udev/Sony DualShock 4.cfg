# Hayato: the DualShock 4 (v1 and v2), over Bluetooth or USB.
#
# RetroArch reads a pad itself; `hayato gamepad` deliberately stops at the
# framework windows. Without a profile here RetroArch says
#
#   [Autoconfig] Wireless Controller (1356/2508) not configured
#
# and falls back to the kernel's button order. That happens to put Cross on
# arcade button 1, which is why FBNeo plays, but nothing declares it: the
# triggers and both sticks are guesses, and an update can move them.
#
# The numbers are the order the kernel reports the buttons — BTN_SOUTH (Cross),
# BTN_EAST (Circle), BTN_NORTH (Triangle), BTN_WEST (Square), BTN_TL (L1),
# BTN_TR (R1), BTN_TL2, BTN_TR2, BTN_SELECT (Share), BTN_START (Options),
# BTN_MODE (PS), BTN_THUMBL, BTN_THUMBR — and the triggers are the ABS_Z (2)
# and ABS_RZ (5) axes. So the face buttons keep the PlayStation layout for
# games: Cross is B, the first arcade button, and Circle is A.
#
# A pad that reports a different order needs its own file: Settings -> Input ->
# Port 1 Controls -> Save Autoconfig writes one into this directory, and a
# per-game change belongs in a remap instead.
input_driver = "udev"
input_device = "Wireless Controller"
input_vendor_id = "1356"
input_product_id = "2508"

# The USB names the same pads report.
input_device_alt1 = "Sony Interactive Entertainment Wireless Controller"
input_vendor_id_alt1 = "1356"
input_product_id_alt1 = "2508"
input_device_alt2 = "Sony Computer Entertainment Wireless Controller"
input_vendor_id_alt2 = "1356"
input_product_id_alt2 = "1476"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_select_btn = "8"
input_start_btn = "9"
input_menu_toggle_btn = "10"
input_l3_btn = "11"
input_r3_btn = "12"

input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_l2_axis = "+2"
input_r2_axis = "+5"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

input_b_btn_label = "Cross"
input_a_btn_label = "Circle"
input_x_btn_label = "Triangle"
input_y_btn_label = "Square"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_axis_label = "L2"
input_r2_axis_label = "R2"
input_select_btn_label = "Share"
input_start_btn_label = "Options"
input_menu_toggle_btn_label = "PS"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
