# The idle screen's terminal: black, no padding, large text.
#
# Same idea as Deboma's default/foot/screensaver.ini (black on black, 18 pt),
# only larger: the Hayato art in ~/.config/hayato/screensaver.txt (the golden
# eagle in block characters over the captions, from scripts/make-brand.sh) is
# 20 columns wide and 12 rows tall, so 26 pt sits well inside the panel.  The
# foreground is the brand's cyan (#7dcfff) because that is the colour the mark
# is drawn in: tte's own effects bring their own palette, and the ones that
# paint in the terminal's foreground - and the static frame
# `hayato-screensaver` prints when tte is missing - are then the brand colour
# instead of white.
#
# Syntax check: foot --check-config -c <this file>.
[main]
font=JetBrains Mono:size=14
pad=0x0
dpi-aware=no

[scrollback]
lines=0

[colors-dark]
background=000000
foreground=7dcfff

[csd]
preferred=server
