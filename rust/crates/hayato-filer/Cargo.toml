[package]
name = "hayato-filer"
version = "0.0.0"
edition = "2024"
description = "Minimalistic native Rust GTK4 file browser for Hayato OS"
publish = false

[[bin]]
name = "hayato-filer"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
hayato-theme = { path = "../hayato-theme" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
