[package]
name = "hayato-games"
# The version the binary reports comes from the repository's VERSION file,
# compiled in by hayato-games-core; this one only satisfies cargo and never ships.
version = "0.0.0"
edition = "2024"
description = "The GTK + WebKit host that plays one Hayato HTML game"
publish = false

[[bin]]
name = "hayato-games"
path = "src/main.rs"

[dependencies]
hayato-games-core = { path = "../hayato-games-core" }
hayato-theme = { path = "../hayato-theme" }
gtk4 = { version = "0.11", features = ["v4_10"] }
webkit6 = "0.6"
soup = { package = "soup3", version = "0.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
