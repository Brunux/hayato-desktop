[package]
name = "hayato-music-core"
version = "0.0.0"
edition = "2024"
description = "Audio engine, DSP spectrum/beat analyzer, library indexer, MPRIS2, and Spotify backend for Hayato Cassette"

[features]
default = ["spotify"]
spotify = []

[dependencies]
cpal = "0.15"
dirs = "5.0"
libc = "0.2"
lofty = "0.22"
realfft = "3.4"
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "pcm", "wav", "isomp4", "aac", "alac"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[dev-dependencies]
tempfile = "3.10"
