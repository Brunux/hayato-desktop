# LazyOS RetroArch kiosk overrides
#
# This is not the user's configuration. The library passes it with
# `--appendconfig`, so RetroArch reads ~/.config/retroarch/retroarch.cfg first
# (the user's settings) and then these values (the session's), and the user's
# file is still where the menu writes changes.
#
# Why a source build instead of Debian's retroarch: the package depends on
# retroarch-assets, which hard-depends on fonts-noto-extra (334 MB) and pulls
# Qt5 for the WIMP menu. This build has no Qt, no assets, no FFmpeg, no Vulkan,
# no online updater, and only RGUI. The library is the menu; RGUI is what a
# person sees when they press F1 inside a game.

video_driver = "wayland"
# ALSA through pipewire-alsa, not libpulse: the ALSA default PCM is the same
# PipeWire graph, and a `pa_simple` stream can wait forever on a suspended
# null sink (the test machine has no analog sink, and RetroArch then never
# creates its window).
audio_driver = "alsa"
menu_driver = "rgui"

# RGUI's built-in Solarized Dark theme (27 in the enum): the in-game menu is
# the session palette instead of the classic green. The custom theme (0) needs
# a preset file and is not used here.
rgui_menu_color_theme = "27"
rgui_browser_directory = "~/Games"

video_fullscreen = "true"
pause_nonactive = "true"
savestate_auto_save = "true"
savestate_auto_load = "true"
savefile_directory = "~/.local/share/lazyos/games/saves"
savestate_directory = "~/.local/state/lazyos/games/states"
screenshot_directory = "~/.local/share/lazyos/games/shots"
system_directory = "~/Games/bios"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"

# One Escape is enough to leave a game: the library reopens behind it, and a
# kiosk that needs the key pressed twice is a kiosk that looks stuck.
quit_press_twice = "false"
input_exit_emulator = "escape"

# There is no updater in this build, and the core list is the image's.
menu_show_core_updater = "false"
menu_show_online_updater = "false"
config_save_on_exit = "true"
